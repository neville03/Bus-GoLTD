<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus&amp;Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one white canvas; sticky header with a role switch; content in an 1120px column. Cards only where something is actionable. Yellow is reserved for the brand mark and focus. */
  --bg:#ffffff; --ink:#16181d; --muted:#656b75; --line:#e6e7ea; --soft:#f5f6f8;
  --accent:#f2b705; --accent-soft:#fff7dc; --accent-ink:#6b4f00;
  --ok:#1b7f47; --ok-soft:#e8f5ed; --warn:#9a5a00; --warn-soft:#fff3e0; --bad:#b8332a; --bad-soft:#fdeeec; --info:#2557a7; --info-soft:#ebf1fb;
  --font-display:'Sora', system-ui, sans-serif;
  --font-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:12px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2} h2{font-size:20px;line-height:1.25} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.ic{flex:none;vertical-align:-3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.02em;text-decoration:none}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--ink)}
.logo small{font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:2px}
.top-actions{display:flex;gap:6px}
.roles{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.roles::-webkit-scrollbar{display:none}
.role{border:0;background:none;padding:9px 12px 11px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.role:hover{color:var(--ink)}
.role[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:22px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2c2f36}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc9c5}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.link:hover{text-decoration:underline}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);font-size:15px;color:var(--ink);font-weight:500}
.inp:focus{outline:none;border-color:var(--ink)}
textarea.inp{min-height:84px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--ink);margin-top:2px;flex:none}

/* chips & pills */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:#c9ccd2}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.verified{color:var(--info);display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:13px}

/* layout */
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:18px}
.card.flat{border:0;background:var(--soft)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s{gap:8px} .stack.l{gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.results{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.split{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.sticky{position:sticky;top:120px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
@media (max-width:860px){.split{grid-template-columns:1fr}.sticky{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}h1{font-size:22px}}

/* search */
.search{display:grid;gap:10px;grid-template-columns:1.3fr 1.3fr 1fr 1fr .7fr 1.2fr auto;align-items:end;padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px -14px rgba(20,22,28,.25)}
@media (max-width:980px){.search{grid-template-columns:1fr 1fr}.search .go{grid-column:1/-1}}

/* bus card */
.bus{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;background:var(--bg);transition:box-shadow .15s,border-color .15s;text-align:left;padding:0}
.bus:hover{border-color:#cfd2d8;box-shadow:0 10px 26px -18px rgba(20,22,28,.4)}
.bus.off{opacity:.62}
.bus .art{background:var(--soft);aspect-ratio:17/8;display:block;width:100%}
.bus .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.price{font-weight:700;font-size:16px}
.price span{font-weight:500;color:var(--muted);font-size:13px}
.star{color:#c98f00}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv.total{border-top:1px solid var(--ink);border-bottom:0;font-weight:700;padding-top:10px;margin-top:4px}

/* tiles */
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{background:var(--bad);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}

/* calendar */
.cals{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cal-h{font-weight:600;margin-bottom:8px;font-size:14px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;user-select:none}
.cal-g.edit{touch-action:none}
.dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px;font-weight:600}
.day{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--ok-soft);color:var(--ok)}
.day.blk{background:repeating-linear-gradient(135deg,#eceef1 0 4px,#f6f7f9 4px 8px);color:#9aa0a8}
.day.bkd{background:var(--ink);color:#fff}
.day.req{background:var(--info-soft);color:var(--info)}
.day.past{background:none;color:#c3c7cd}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day.ed{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--muted);padding-right:10px}
.step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}
.step.on{color:var(--ink)} .step.on b{background:var(--ink);color:#fff;border-color:var(--ink)}
.step.done b{background:var(--ok);color:#fff;border-color:var(--ok)}

/* timeline */
.tl{display:flex;gap:0;margin:4px 0}
.tl > div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tl .bar{height:4px;border-radius:2px;background:var(--line)}
.tl .on{color:var(--ink)} .tl .on .bar{background:var(--ok)}
.tl > div + div .bar{margin-left:3px}

.notice{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:14px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:#5b3600}
.notice.info{background:var(--info-soft);color:#173a73}
.notice.ok{background:var(--ok-soft);color:#0f4f2b}
.notice.bad{background:var(--bad-soft);color:#7a1d16}
.notice.acc{background:var(--accent-soft);color:#4d3900}

.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .4s}
.progress.done > i{background:var(--ok)}

/* list rows */
.list{border:1px solid var(--line);border-radius:var(--r)}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 260px}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);width:100%;text-align:left}
.check .box{width:26px;height:26px;border-radius:8px;border:1.5px solid #c6c9cf;display:grid;place-items:center;flex:none;color:#fff}
.check.on{border-color:#bfe2cc;background:var(--ok-soft)}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.pf{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.pf button{border:0;background:var(--bg);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.pf button + button{border-left:1px solid var(--line)}
.pf button.p[aria-pressed="true"]{background:var(--ok);color:#fff}
.pf button.f[aria-pressed="true"]{background:var(--bad);color:#fff}

.phone{max-width:420px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px -30px rgba(20,22,28,.35)}
.phone-bar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}

.map{border-radius:12px;background:var(--soft);overflow:hidden}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;color:#d3d6db}
.stars button.on{color:#e0a100}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(18,20,24,.38);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border-radius:16px;max-width:520px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:tin .25s ease-out}
.toast .via{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.mini-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--bg);cursor:pointer}
.mini-card:hover{border-color:#cfd2d8}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <a class="logo" href="#hire" aria-label="Bus&amp;Go home">
        <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r=".6" fill="currentColor"/><circle cx="16" cy="14.5" r=".6" fill="currentColor"/></svg></span>
        Bus&amp;Go <small>Ltd</small>
      </a>
      <div class="top-actions">
        <button class="btn sm" data-act="guide">Demo guide</button>
        <button class="btn sm" data-act="reset" title="Restore the sample data">Reset</button>
      </div>
    </div>
    <nav class="roles" id="roles" aria-label="Switch view"></nav>
  </div>
</header>
<main id="app"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script>
/* ============ constants & helpers ============ */
const TODAY = '2026-11-01';
const STORE = 'busandgo-demo-v1';
const SEAT_SIZES = [14,18,25,33,45,60];
const SUGGESTED = {14:350000,18:450000,25:600000,33:750000,45:920000,60:1150000};
const PURPOSES = ['School trip','Church event','Wedding','Funeral','Corporate staff trip','Tour','Sports club','NGO field programme','University or student group','Special conversion project'];
const TOWNS = {
  'Kampala':[0.3476,32.5825],'Entebbe':[0.0512,32.4637],'Mukono':[0.3533,32.7553],'Wakiso':[0.4044,32.4594],
  'Jinja':[0.4244,33.2042],'Masaka':[-0.3338,31.7341],'Mbarara':[-0.6072,30.6545],'Lake Mburo':[-0.62,30.95],
  'Fort Portal':[0.671,30.275],'Murchison Falls':[2.2785,31.68],'Gulu':[2.7724,32.2881],'Mbale':[1.0827,34.175],'Kabale':[-1.2486,29.9899]
};
const PICKUPS = ['Kampala','Entebbe','Mukono','Wakiso','Jinja'];
const ME = {name:'Grace Namusoke', org:'Bethel Community Church', phone:'0772 418 552'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => 'UGX ' + Math.round(n).toLocaleString('en-US');
const fmtK = n => n >= 1e6 ? 'UGX ' + (n/1e6).toFixed(n%1e6===0?0:2).replace(/\.?0+$/,'') + 'M' : 'UGX ' + Math.round(n/1000) + 'k';
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s,n) => { const d = toD(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const fmtDate = (s, y) => toD(s).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', ...(y?{year:'numeric'}:{})});
const fmtRange = (a,b) => a===b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`;
const range = (a,b) => { const out=[]; for(let s=a; s<=b; s=addDays(s,1)) out.push(s); return out; };
const roundTo = (n, step) => Math.round(n/step)*step;
function roadKm(a,b){
  if(a===b) return 20;
  const [la1,lo1] = TOWNS[a], [la2,lo2] = TOWNS[b], R=6371, r=Math.PI/180;
  const h = Math.sin((la2-la1)*r/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return roundTo(2*R*Math.asin(Math.sqrt(h))*1.3, 5);
}
const uid = p => p + Math.random().toString(36).slice(2,7);

const I = {
  check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  pin:'<path d="M12 21s-6-5.6-6-11a6 6 0 1112 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 010 6M21 20c0-2.6-1.6-4.8-4-5.6"/>',
  snow:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>',
  gps:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
  belt:'<path d="M7 3l10 18"/><rect x="9" y="11" width="6" height="4" rx="1"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  next:'<path d="M9 5l7 7-7 7"/>',

/* ============ pricing & rules ============ */
function quote(bus, q, rate){
  const days = Math.max(1, diff(q.start, q.end)+1);
  let hire, basis;
  if(days >= 30){ const m=Math.floor(days/30), r=days%30; hire = m*bus.monthly + Math.min(r*bus.daily, bus.monthly); basis = `${m} month${m>1?'s':''}${r?` + ${r} day${r>1?'s':''}`:''}`; }
  else if(days >= 7){ const w=Math.floor(days/7), r=days%7; hire = w*bus.weekly + Math.min(r*bus.daily, bus.weekly); basis = `${w} week${w>1?'s':''}${r?` + ${r} day${r>1?'s':''}`:''}`; }
  else { hire = days*bus.daily; basis = `${days} day${days>1?'s':''} × ${fmt(bus.daily)}`; }
  const oneWay = roadKm(q.pickup, q.dest), km = oneWay*2, allowance = 200*days, extraKm = Math.max(0, km-allowance), kmCost = extraKm*bus.extraKm;
  const nights = days-1, overnight = nights*bus.overnight;
  const ins = q.addons?.ins ? 25000*days : 0, escort = q.addons?.escort ? 40000*days : 0;
  const total = hire + kmCost + overnight + ins + escort;
  const deposit = roundTo(total*0.3, 1000);
  const r = rate ?? DB.settings.commission;
  const commission = Math.round(total*r/100), driverBonus = (DB?.settings?.driverBonus ?? 30000)*days;
  return {days, basis, hire, oneWay, km, allowance, extraKm, kmCost, nights, overnight, ins, escort, total, deposit, balance: total-deposit, rate:r, commission, driverBonus, payout: total-commission-driverBonus};
}

function busDays(busId, ignore){
  const blackout = new Set(DB.blackouts[busId]||[]), booked = new Set(), requested = new Set();
  DB.bookings.filter(k => k.bus===busId && ACTIVE.includes(k.status) && k.id!==ignore).forEach(k => range(k.start,k.end).forEach(d => (k.status==='requested'?requested:booked).add(d)));
  return {blackout, booked, requested};
}
function conflict(busId, start, end){
  const {blackout, booked, requested} = busDays(busId);
  for(const d of range(start, end)){
    if(blackout.has(d)) return {type:'blackout', date:d, text:`The school uses this bus on ${fmtDate(d)}.`};
    if(booked.has(d) || requested.has(d)) return {type:'booked', date:d, text:`Already booked on ${fmtDate(d)}.`};
  }
  return null;
}
function nextOpen(busId){

  for(let d=addDays(TODAY,1); out.length<3 && d<'2027-03-01'; d=addDays(d,1)) if(!blackout.has(d)&&!booked.has(d)&&!requested.has(d)) out.push(d);

}

function filteredBuses(){
  const f = S.filters, s = S.search;
  let list = DB.buses.filter(b => b.status==='listed' && schoolById(b.school).status==='verified');
  list = list.filter(b => b.seats >= (+s.pax||1));
  if(f.seats) list = list.filter(b => b.seats===f.seats);
  if(f.ac) list = list.filter(b=>b.ac); if(f.belts) list = list.filter(b=>b.belts); if(f.gps) list = list.filter(b=>b.gps);
  if(f.fresh) list = list.filter(b => inspectedDaysAgo(b) <= 30);
  if(f.selfDrive) list = list.filter(b => b.selfDrive);
  if(f.maxPrice) list = list.filter(b => b.daily <= f.maxPrice);
  if(f.minRating) list = list.filter(b => ratingOf(b) >= f.minRating);
  const score = b => (conflict(b.id, s.start, s.end)?0:100) + ratingOf(b)*10 - Math.min(inspectedDaysAgo(b),120)/30 - (b.seats - s.pax)/20;
  return list.sort((a,b) => score(b)-score(a));
}

function calendarHtml(busId, months, opts={}){
  const {blackout, booked, requested} = busDays(busId);
  const out = months.map(([y,m]) => {
    const first = new Date(y,m,1), pad = (first.getDay()+6)%7, nd = new Date(y,m+1,0).getDate();
    let cells = ['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('') + '<div></div>'.repeat(pad);
    for(let i=1;i<=nd;i++){
      const d = iso(new Date(y,m,i)); let cls='day';
      if(d<=TODAY) cls+=' past'; else if(booked.has(d)) cls+=' bkd'; else if(requested.has(d)) cls+=' req'; else if(blackout.has(d)) cls+=' blk';
      if(opts.sel && d>=opts.sel[0] && d<=opts.sel[1]) cls+=' sel';
      const editable = opts.edit && d>TODAY && !booked.has(d) && !requested.has(d);
      cells += `<div class="${cls}${editable?' ed':''}" ${editable?`data-day="${d}"`:''} title="${fmtDate(d)}">${i}</div>`;
    }
    return `<div><div class="cal-h">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div><div class="cal-g ${opts.edit?'edit':''}" ${opts.edit?`data-cal="${busId}"`:''}>${cells}</div></div>`;
  }).join('');
  return `<div class="cals">${out}</div>
  <div class="legend"><span><i style="background:var(--ok-soft);border:1px solid #bfe2cc"></i>Open for hire</span><span><i style="background:repeating-linear-gradient(135deg,#dfe2e6 0 3px,#f6f7f9 3px 6px)"></i>School use</span><span><i style="background:var(--ink)"></i>Booked</span><span><i style="background:var(--info-soft);border:1px solid #c9d7f1"></i>Requested</span>${opts.sel?'<span><i style="outline:2px solid var(--accent);outline-offset:-2px"></i>Your dates</span>':''}</div>`;
}

function tripTimeline(k){

    sc.unlock1 = TODAY; sc.rewards.push({id:uid('r'), title:'Free weekly check', note:`Unlocked ${fmtDate(TODAY)} · ${st.r1Trips} trips in ${st.r1Days} days`, status:'available'});

  }

    sc.unlock2 = TODAY; sc.rewards.push({id:uid('r'), title:`${st.r2Pct}% off one major service`, note:`Unlocked ${fmtDate(TODAY)}`, status:'available'});

  }
}

    const busId = grid.dataset.cal; let mode = null; const touched = new Set();
    const paint = cell => { if(!cell || !cell.dataset.day || touched.has(cell.dataset.day)) return; touched.add(cell.dataset.day); cell.classList.toggle('blk', mode==='block'); };
    grid.addEventListener('pointerdown', e => { const c = e.target.closest('[data-day]'); if(!c) return; e.preventDefault(); mode = c.classList.contains('blk') ? 'open' : 'block'; touched.clear(); paint(c); grid.setPointerCapture(e.pointerId); });
    grid.addEventListener('pointermove', e => { if(!mode) return; const c = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-day]'); if(c && grid.contains(c)) paint(c); });
    const finish = () => { if(!mode) return; const set = new Set(DB.blackouts[busId]||[]); touched.forEach(d => mode==='block' ? set.add(d) : set.delete(d)); DB.blackouts[busId] = [...set]; const n = touched.size, m = mode; mode = null; save(); render(); toast(`${n} day${n>1?'s':''} ${m==='block'?'blocked for school use':'opened for hire'}.`); };
    grid.addEventListener('pointerup', finish); grid.addEventListener('pointercancel', finish);
  });
}

function fromHash(){ const h = location.hash.slice(1); S.role = ROLES.some(r=>r.id===h) ? h : 'hire'; render(); }
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
